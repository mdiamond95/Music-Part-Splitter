<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140F" media="(prefers-color-scheme: dark)">
<title>Part Splitter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* Vertical rhythm is an 8px grid: every margin, padding and gap below is a multiple of --u,
     so the page keeps one spacing scale instead of the assorted 4/6/14/18/22px it grew. */
  :root{
    color-scheme:light dark;
    --u:8px;
    --paper:#F6F3EC; --paper-2:#EFEAE0; --card:#FFFFFF;
    --ink:#1C1A17; --ink-2:#5C5750; --ink-3:#8A8378;
    --rule:#D6CFC0; --rule-soft:#E8E2D5; --stave:#B9B1A0;
    /* --red paints surfaces and carries white text; --red-text is the same idea sitting on paper.
       They are separate tokens only so dark mode can lighten one without wrecking contrast on the other. */
    --red:#8E1B2A; --red-text:#8E1B2A; --red-2:#B63A48; --red-tint:#FBF0F1; --red-line:#E0C0C5;
    --ok:#2E6B3E;
    --shadow:0 1px 2px rgba(28,26,23,.04), 0 6px 20px rgba(28,26,23,.05);
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#15140F; --paper-2:#1F1D17; --card:#1B1914;
      --ink:#EDE8DD; --ink-2:#ABA497; --ink-3:#7E776B;
      --rule:#3B3830; --rule-soft:#2B2922; --stave:#524D43;
      --red:#A8303F; --red-text:#E48B95; --red-2:#E07C86; --red-tint:#2B1A1D; --red-line:#5C333A;
      --ok:#7FC894;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .wrap{max-width:900px;margin:0 auto;padding:calc(var(--u)*4) calc(var(--u)*2.5);
        padding-bottom:calc(var(--u)*10 + env(safe-area-inset-bottom))}

  header{margin-bottom:calc(var(--u)*4)}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,38px);line-height:1.1;letter-spacing:-.01em;margin:0}
  h1 em{font-style:italic;color:var(--red-text)}
  .sub{color:var(--ink-2);font-size:15px;line-height:1.5;margin-top:var(--u);max-width:46ch}

  /* Load progress, kept at the top of the page: on a 79-page score the status line down in the
     review card is off-screen while the read is happening, which is exactly when it matters. */
  .progress{margin-bottom:calc(var(--u)*3)}
  .ptrack{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
  .pbar{height:100%;width:0;background:var(--red);border-radius:3px}
  @media (prefers-reduced-motion:no-preference){.pbar{transition:width .18s linear}}
  .ptext{margin-top:var(--u);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* Drop zone: a real five-line stave in the SVG below, brace sized to it, hairlines that stay
     hairlines at any width (non-scaling-stroke). The old version was a repeating-linear-gradient
     that clipped mid-line and read as stray rules. */
  .drop{position:relative;display:block;text-align:center;cursor:pointer;
        background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
        padding:calc(var(--u)*6) calc(var(--u)*3)}
  .drop.over{border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint)}
  .drop .stave{display:block;width:min(280px,78%);height:auto;margin:0 auto calc(var(--u)*3)}
  .drop .stave line,.drop .stave path{vector-effect:non-scaling-stroke}
  .drop .stave .ln{stroke:var(--stave);stroke-width:.9}
  .drop .stave .bar{stroke:var(--stave);stroke-width:1.2}
  .drop .stave .brace{stroke:var(--red-text);stroke-width:1.8;stroke-linecap:round;fill:none}
  .drop strong{display:block;font-family:var(--display);font-size:23px;font-weight:400;line-height:1.25}
  .drop span{display:block;color:var(--ink-2);font-size:14px;margin-top:var(--u)}
  .drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  @media (prefers-reduced-motion:no-preference){.drop{transition:border-color .15s,box-shadow .15s}}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
        padding:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
  .card h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2;margin:0 0 var(--u)}
  .meta{color:var(--ink-2);font-size:14px;line-height:1.5}
  .meta b{color:var(--ink);font-weight:600}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2) calc(var(--u)*3);margin-top:calc(var(--u)*3)}
  .opt label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;margin-bottom:var(--u)}
  .opt input[type=text]{width:100%;font:inherit;font-size:16px;padding:calc(var(--u)*1.5);border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
  .toggle{display:flex;align-items:center;gap:var(--u);font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);align-self:end;padding-bottom:calc(var(--u)*1.5)}
  .toggle input{width:20px;height:20px;flex:none;accent-color:var(--red)}
  .hint{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink-3);margin-top:var(--u);word-break:break-word}

  table{width:100%;border-collapse:collapse;margin-top:calc(var(--u)*2)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:left;padding:var(--u);border-bottom:1px solid var(--rule)}
  th.status,td.status{text-align:right}
  td{padding:calc(var(--u)*1.5) var(--u);border-bottom:1px solid var(--rule-soft);vertical-align:middle;font-size:15px}
  td.n{font-family:var(--mono);font-size:13px;color:var(--ink-3);width:44px;font-variant-numeric:tabular-nums}
  /* Fixed 3:4 box: portrait parts and landscape score pages letterbox into the same slot, so rows
     keep their height instead of jumping about as each thumbnail decodes. */
  th.th{width:72px}
  td.th img{width:54px;height:72px;object-fit:contain;object-position:center;border:1px solid var(--rule);border-radius:2px;display:block;background:#fff}
  select{font:inherit;font-size:15px;padding:calc(var(--u)*1.25) calc(var(--u)*1.5);border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
  /* "Not detected" has to be unmissable without shouting: a tinted field and a red edge, no siren. */
  select.warn{border-color:var(--red-line);background:var(--red-tint);color:var(--red-text)}
  td.status{font-size:13px;color:var(--ink-2);width:120px;white-space:nowrap;font-variant-numeric:tabular-nums}
  td.status.dup{color:var(--ink-3)}
  tr:has(select.warn) td.status{color:var(--red-text);font-weight:600}
  tr.dropped td.n,tr.dropped td.th,tr.dropped td.status{opacity:.55}
  tr.dropped td.th img{opacity:.55}

  .actions{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.5);align-items:center;margin-top:calc(var(--u)*3)}
  /* One primary. Everything else is a quiet outline so the eye lands on Export. */
  button{font:inherit;font-size:16px;font-weight:500;padding:calc(var(--u)*1.5) calc(var(--u)*2.5);border-radius:8px;
         border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  button.quiet{background:transparent;color:var(--ink-2)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-within{outline:3px solid var(--red-2);outline-offset:2px}
  .out{font-size:14px;line-height:1.4;color:var(--ink-2)}
  .out.ok{color:var(--ok)}
  .out.err{color:var(--red-text)}
  .files{margin:calc(var(--u)*2) 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:13px}
  .files li{padding:var(--u) 0;border-bottom:1px solid var(--rule-soft);word-break:break-word}
  .files li b{font-weight:600;color:var(--ink)}
  .hidden{display:none}

  @media (max-width:600px){
    .opts{grid-template-columns:1fr}
    .toggle{align-self:start;padding-bottom:0}
  }
  /* Phones: the four columns cannot survive 480px, so each page becomes a card — thumbnail on the
     left (it is the whole point of the review step, so it stays visible), page number and status on
     one line, the part dropdown full width underneath. */
  @media (max-width:480px){
    .wrap{padding-left:calc(var(--u)*2);padding-right:calc(var(--u)*2)}
    .card{padding:calc(var(--u)*2.5) calc(var(--u)*2)}
    table,tbody,tr,td{display:block;width:auto}
    thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    tr{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-areas:"thumb head" "thumb part";
       column-gap:calc(var(--u)*1.5);row-gap:var(--u);align-items:center;
       padding:calc(var(--u)*2) 0;border-bottom:1px solid var(--rule-soft)}
    td{border:0;padding:0}
    td.n{grid-area:head;width:auto;align-self:end}
    td.n::after{content:""}
    td.th{grid-area:thumb;align-self:start}
    td.th img{width:64px;height:85px}
    tr>td:nth-child(3){grid-area:part}
    tr>td:nth-child(3) select{width:100%}
    td.status{grid-area:head;width:auto;text-align:right;align-self:end}
    .actions{gap:var(--u)}
    .actions button{flex:1 1 auto}
    .actions .out{flex:1 0 100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Part <em>Splitter</em></h1>
    <div class="sub">Turn a set-of-parts PDF into one file per part. Everything runs on this device; nothing is uploaded.</div>
  </header>

  <div class="progress hidden" id="progress" role="status" aria-live="polite">
    <div class="ptrack"><div class="pbar" id="pbar"></div></div>
    <div class="ptext" id="ptext"></div>
  </div>

  <label class="drop" id="drop">
    <svg class="stave" viewBox="0 0 264 48" aria-hidden="true" focusable="false">
      <path class="brace" d="M17 6 C 10 13, 15 20, 8 24 C 15 28, 10 35, 17 42"/>
      <g class="ln-group">
        <line class="ln" x1="24" y1="8" x2="256" y2="8"/>
        <line class="ln" x1="24" y1="16" x2="256" y2="16"/>
        <line class="ln" x1="24" y1="24" x2="256" y2="24"/>
        <line class="ln" x1="24" y1="32" x2="256" y2="32"/>
        <line class="ln" x1="24" y1="40" x2="256" y2="40"/>
      </g>
      <line class="bar" x1="24" y1="8" x2="24" y2="40"/>
      <line class="bar" x1="256" y1="8" x2="256" y2="40"/>
    </svg>
    <strong>Choose a set-of-parts PDF</strong>
    <span>Tap to pick from Files, or drop a PDF here</span>
    <input type="file" id="file" accept="application/pdf,.pdf">
  </label>

  <section class="card hidden" id="summary">
    <h2 id="title">—</h2>
    <div class="meta" id="meta"></div>
    <div class="opts">
      <div class="opt">
        <label for="prefix">Filename prefix</label>
        <input type="text" id="prefix" autocapitalize="off" autocorrect="off">
        <div class="hint" id="example"></div>
      </div>
      <div class="opt">
        <label class="toggle"><input type="checkbox" id="dedupe" checked> Drop duplicate copies of a page</label>
      </div>
    </div>
  </section>

  <section class="card hidden" id="review">
    <h2>Check each page</h2>
    <div class="meta">Detected from the page header. Fix any that are wrong before exporting.</div>
    <table>
      <thead><tr><th>Pg</th><th class="th"></th><th>Part</th><th class="status">Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="actions">
      <button class="primary" id="export">Export parts</button>
      <button class="quiet" id="reset">Start over</button>
      <span class="out" id="out"></span>
    </div>
    <ul class="files" id="files"></ul>
  </section>
</div>

<script id="core">
/* Detection and planning logic. No DOM, no pdf.js API calls, no browser globals — tools/map.mjs
   pulls this exact block out of index.html and runs it in Node, so the harness tests shipped code. */

// Canonical part list, in band order. Each has one or more regexes tested on normalised header text.
const PARTS = [
  ["Full Score",        [/\bFULL SCORE\b/, /(?<!PERCUSSION\s{0,3})\bSCORE\b/, /\bCONDUCTOR\b/]],
  ["Flute/Oboe",        [/\bFLUTE\b/, /\bOBOE\b/]],
  ["Soprano Eb",        [/\bSOPRANO\b/]],
  ["Solo Cornet Bb",    [/\bSOLO CORNET/]],
  ["Repiano Cornet Bb", [/\bREPIANO/]],
  ["1st Cornet Bb",     [/\b1ST CORNET/]],
  ["2nd Cornet Bb",     [/\b2ND CORNET/]],
  ["3rd Cornet Bb",     [/\b3RD CORNET/]],
  ["Flugel Horn Bb",    [/\bFLUGEL/]],
  ["Solo Horn Eb",      [/\bSOLO HORN/]],
  ["1st Horn Eb",       [/\b1ST HORN/]],
  ["2nd Horn Eb",       [/\b2ND HORN/]],
  ["1st Horn F",        [/\b1ST\.?\s*F\.?\s*HORN\b/, /\b1ST HORN F\b/]],
  ["2nd Horn F",        [/\b2ND\.?\s*F\.?\s*HORN\b/, /\b2ND HORN F\b/]],
  ["1st Baritone Bb",   [/\b1ST BARITONE/]],
  ["2nd Baritone Bb",   [/\b2ND BARITONE/]],
  ["Baritone Bb",       [/\bBARITONE B ?B\b/]],
  ["1st Baritone B.C.", [/\b1ST\.?\s*BARITONE\b.{0,60}?\bB\.C\./]],
  ["2nd Baritone B.C.", [/\b2ND\.?\s*BARITONE\b.{0,60}?\bB\.C\./]],
  ["Baritone B.C.",     [/\bBARITONE\b.{0,60}?\bB\.C\./]],
  ["1st Trombone Bb",   [/\b1ST TROMBONE/]],
  ["2nd Trombone Bb",   [/\b2ND TROMBONE/]],
  ["Bass Trombone",     [/\bBASS TROMBONE/]],
  ["Euphonium Bb",      [/\bEUPHONIUM/]],
  ["Euphonium B.C.",    [/\bEUPHONIUM\b.{0,60}?\bB\.C\./]],
  ["Bass Eb",           [/\bBASS (?:IN )?E ?B\b/, /\bE ?B BASS\b/]],
  ["Bass Bb",           [/\bBASS (?:IN )?B ?B\b/, /\bB ?B BASS\b/]],
  ["Tuba B.C.",         [/\bTUBA\b.{0,60}?\bB\.C\./, /\bTUBA\b/]],
  ["String Bass",       [/\bSTRING\s*\/?\s*ELECTRIC BASS\b/, /\bSTRING BASS\b/]],
  ["Percussion Score",  [/\bPERCUSSION\b(?:(?!\b(?:I|II|1|2)\b).){0,40}?\bSCORE\b/]],
  ["Percussion I",      [/\bPERCUSSION\s*(I|1)\b(?!I)/]],
  ["Percussion II",     [/\bPERCUSSION\s*(II|2)\b/]],
  ["Timpani",           [/\bTIMP/]],
  ["Drums",             [/\bDRUM/]],
];
const INHERIT = "";            // dropdown: no explicit choice, continue the previous page
const SKIP = "__skip__";       // dropdown: leave this page out entirely
const INHERIT_LABEL = "— inherit from previous page —";
const SKIP_LABEL = "Skip this page";

function norm(s){
  return s.replace(/[♭𝄫]/g,"b").replace(/♯/g,"#").toUpperCase().replace(/\s+/g," ").trim();
}
// Return the part whose regex matches the longest span of h, so a qualified label beats the plain one
// it contains: "2nd Baritone/Trombone B.C." must not settle for "2nd Baritone". Ties keep the earlier
// entry, which preserves the band-order preference the list has always encoded.
function matchPart(h){
  let best=null, bestLen=0;
  for(const [name,res] of PARTS) for(const r of res){
    const m = h.match(r);
    if(m && m[0].length > bestLen){ best=name; bestLen=m[0].length; }
  }
  return best;
}
function readingOrder(items){
  return [...items].sort((a,b)=>(b.transform[5]-a.transform[5])||(a.transform[4]-b.transform[4]));
}

// Some engravers emit one text item per glyph, so "Soprano" arrives as S,o,p,r,a,n,o and no part regex
// can ever match. Stitch runs of single-character items back into words using the horizontal gap
// between them, measured as a fraction of the font size: on the local fixtures gaps inside a word reach
// 0.06 and gaps between words start at 0.20, so 0.12 sits in the empty band between the two. Items that
// already carry whole words are passed through untouched, which leaves normally-engraved sets exactly
// as they were. Music glyphs stay separate because they are spread across the stave, far past the gap.
const GLYPH_GAP = 0.12;
function stitch(items){
  const words = [];
  for(const it of readingOrder(items)){
    const last = words[words.length-1];
    const single = it.str.trim().length === 1;
    const size = Math.abs(it.transform[0]), x = it.transform[4], y = it.transform[5], w = it.width||0;
    // The gap is bounded on both sides: a negative gap means the next glyph sits left of the previous
    // one, which is a second column sharing a baseline (composer credit beside a part label), not a word.
    const gap = x - (last ? last.x + last.w : 0);
    if(last && last.glyphs && single && Math.abs(y-last.y) < 1 && Math.abs(gap) < GLYPH_GAP*size){
      last.str += it.str; last.w = x + w - last.x;   // run continues; still counts as glyph-built
      continue;
    }
    words.push({str:it.str, size, x, y, w, glyphs:single});
  }
  return words;
}
function textOf(words){ return words.map(w=>w.str).join(" "); }

// The part label is the first thing top-left. Read words in reading order and take the earliest match,
// so instrument cues further down the header (e.g. "Bass Eb" on a Bass Bb part) can't hijack detection.
// Once something matches, keep reading a few more words: qualifiers trail their base name, and the
// accumulator would otherwise commit to "2nd Baritone" before "B.C." had even been read. Only a
// strictly longer match displaces the incumbent, so a later cue cannot take over on equal footing.
const LOOKAHEAD = 4;
// Abbreviations run down the left margin of a score page: Sop., Solo Cor., 1st Hn.
const ABBREV = /\b(SOP|COR|HN|BAR|TROM|TBN|EUPH|PERC)\.?$/;
function detectPart(items){
  let acc="", best=null, bestLen=0, after=-1, ev=null;
  for(const w of stitch(items)){
    acc += " "+w.str;
    const h = norm(acc);
    for(const [name,res] of PARTS) for(const r of res){
      const m = h.match(r);
      if(m && m[0].length > bestLen){ best=name; bestLen=m[0].length; ev=w; if(after<0) after=0; }
    }
    if(after>=0 && ++after > LOOKAHEAD) break;
  }
  // Weak evidence is a match that does not look like a part label: the small type of a score's
  // instrument column, an abbreviation from that column, or a word swallowed by a prose paragraph.
  const weak = !!ev && (ev.size < 9 || ABBREV.test(norm(ev.str)) || ev.str.length > 40);
  return {part:best, weak};
}
function safeName(s){ return s.replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g," ").trim(); }

// transform[1] !== 0 means rotated text — the licence stamp down the right edge. Always ignored.
function uprightItems(items){ return items.filter(it=>Math.abs(it.transform[1])<0.01 && it.str.trim()); }
// transform[5] is y, measured bottom-up, so the header band is the top 20% of the page.
function headerItems(upright, vpHeight){ return upright.filter(it=>it.transform[5] > vpHeight*0.80); }

// A score page names every instrument in the band down its left margin, so it matches many part
// labels at once where a part page matches only its own. Counting NON-OVERLAPPING matched regions
// keeps three regexes hitting one "2nd Baritone/Trombone B.C." label from reading as three
// instruments. Measured over all three fixtures, 116 pages: every part page matches at most 2, while
// the score pages match 5 and 12. Four sits in that empty band. This is a page-level signal and does
// not care how big the labels are, which is the case the weak-evidence test cannot see.
const SCORE_LABELS = 4;
function labelCount(items){
  const h = norm(textOf(stitch(items)));
  const spans = [];
  for(const [name,res] of PARTS) for(const r of res){
    const m = h.match(r);
    if(m) spans.push([m.index, m.index + m[0].length, name]);
  }
  spans.sort((a,b)=>a[0]-b[0]);
  // Drop spans that overlap one already counted, then count distinct instruments among what is left:
  // one label matched by three regexes is one instrument, and one instrument named in two places on a
  // page (a part's own label plus a cue) is still one instrument.
  const seen = new Set();
  let end = -1;
  for(const [from,to,name] of spans) if(from >= end){ seen.add(name); end = to; }
  return seen.size;
}

// A part's first page carries a title block; its continuation pages carry only a small running head.
// Measured across the local fixtures: title blocks are set at 15.5-24pt and running heads at 8-10pt,
// so 12pt sits in a wide empty gap. Music glyphs are excluded by requiring a letter and two characters
// (notation fonts emit single non-letter glyphs at large sizes).
const FIRST_PAGE_PT = 12;
function titleSize(words){
  const lettered = words.filter(w=>/[A-Za-z]{3,}/.test(w.str));
  return lettered.length ? Math.max(...lettered.map(w=>w.size)) : 0;
}
// A page that opens a new part must never continue the previous one, even when its own label is
// unrecognised — inheriting there would silently file it under the wrong neighbour. A piece number
// or a title block in the header both mean "this page starts something".
function hasPieceNumber(words){
  return words.some(w=>/^No\.?\s*\d{2,5}$/i.test(w.str.trim()) && w.size>=11);
}
function isFirstPage(words){
  return hasPieceNumber(words) || titleSize(words) >= FIRST_PAGE_PT;
}

// Everything the app knows about a page before the user touches anything.
function pageRecord(n, items, vpHeight, vpWidth){
  const upright = uprightItems(items);
  const header = headerItems(upright, vpHeight);
  const headerWords = stitch(header);
  const hit = detectPart(header);
  const labels = labelCount(upright);
  return {
    n,
    labels,                         // distinct part labels on the page; many means a score
    score: labels >= SCORE_LABELS,
    detected: hit.part,             // what the header says; never changes after load
    weak: hit.weak,                 // the match does not look like a part label
    override: undefined,            // what the user chose in the dropdown, if anything
    first: isFirstPage(headerWords),// opens a new part, so it may not inherit
    number: hasPieceNumber(headerWords),
    size: `${Math.round(vpWidth)}x${Math.round(vpHeight)}`,
    header: textOf(headerWords),
    key: norm(textOf(stitch(upright))),
  };
}

// Piece numbers and titles can sit anywhere on the page (several pieces per page), so scan the whole page.
function scanMeta(upright, numbers, titles){
  upright.forEach(it=>{
    const t=it.str.trim(); const size=it.transform[0];
    const m=t.match(/^No\.?\s*(\d{2,5})$/i); if(m && size>=11){ numbers.add(m[1]); return; }
    if(size>=14 && /^[A-Z][A-Z0-9 .'’,&!:-]{3,}$/.test(t)) titles.add(t);
  });
}

// A score-fronted set opens with a cover, and often a prose notes page, carrying nothing the header
// detector recognises — on both local score-fronted fixtures the cover's title, composer and series
// line all sit at 40-60% page height, well below the 20% header band, so the page reads as empty.
// Those pages are the score's front matter, not junk. The default below is deliberately narrow: it
// fires only on a run starting at page 1, only when the document turned out to have a Full Score at
// all (a plain set of parts with a junk first page must not invent one), and only up to COVER_MAX
// pages, because a longer unassigned run means something else is wrong and should stay visible.
const COVER_MAX = 3;

// Resolve each page to an effective part, in page order, then group.
//
// A page with no label of its own continues the previous page's part, which is how two- and
// three-page parts stay together. Inheritance deliberately follows the previous page's part even
// when that page was dropped as a duplicate: a two-copy two-page part arrives A1 A2 A1 A2, and the
// second A2 has to inherit "A" before the dedupe key can recognise it as a copy of the first A2.
// An explicit Skip breaks the chain — the page after it has nothing to continue.
function plan(pages, dedupe){
  const groups = new Map(); const seen = new Map();
  const status = [];
  let carried = null;   // effective part of the previous page
  let source = 0;       // page that last carried a part of its own, for the "cont. of p.N" label
  let runSize = null;   // page size the current part started on
  const leading = []; let leadingOpen = true;   // pages 1..k that resolved to nothing at all
  for(const p of pages){
    // A full score runs for many pages and only the first is labelled. Inside that run the title block
    // cannot mark a first page — every score page repeats the title — so the run is bounded by page
    // size instead, which is what actually separates a landscape score from the portrait parts behind
    // it, and by the piece number the brief calls out. While the run holds, weak matches from the
    // score's own instrument column are ignored rather than starting a bogus part.
    const scoreRun = carried === "Full Score" && p.size === runSize && !p.number;
    let part = null, inherited = false;
    if(p.override === SKIP)   part = null;
    else if(p.override)       part = p.override;
    // Takes precedence over detection: a score page carries real, full-size part labels, and one of
    // them would otherwise win outright. Only an explicit choice in the dropdown outranks it.
    else if(p.score)          part = "Full Score";
    else if(p.detected && !(scoreRun && p.weak)) part = p.detected;
    else if(carried && (!p.first || scoreRun)){ part = carried; inherited = true; }

    if(part && !inherited){ source = p.n; runSize = p.size; }
    carried = part;

    // The leading run ends at the first page that resolves to something, and at any page the user
    // has spoken for — an explicit part or Skip outranks the default, so neither joins the run.
    if(leadingOpen){
      if(part || p.override !== undefined) leadingOpen = false;
      else leading.push(p.n);
    }

    if(!part){ status[p.n]={dropped:true,label:"skipped",part:null,inherited:false}; continue; }
    const base = {part, inherited, from: inherited ? source : 0};
    const k = part+"§"+p.key;
    if(dedupe && seen.has(k)){ status[p.n]={...base,dropped:true,label:`copy of p.${seen.get(k)}`,dup:true}; continue; }
    seen.set(k,p.n);
    if(!groups.has(part)) groups.set(part,[]);
    groups.get(part).push(p.n);
    status[p.n]={...base,dropped:false,label: inherited ? `cont. of p.${source}` : "keep"};
  }

  // Front matter joins the score. Prepended in document order, and never deduped: a cover is by
  // definition a page the pipeline recognises nothing on, so a dedupe key match would be a
  // coincidence, and losing a cover is worse than carrying two.
  const score = groups.get("Full Score");
  if(score && leading.length && leading.length <= COVER_MAX){
    for(let i=leading.length-1; i>=0; i--){
      const n = leading[i];
      score.unshift(n);
      status[n] = {part:"Full Score", inherited:false, from:0, dropped:false, label:"cover → Full Score"};
    }
  }
  return {groups,status};
}
</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let state = null;

const $ = id => document.getElementById(id);
const drop = $("drop"), fileIn = $("file");
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0]; if(f) load(f);});
fileIn.addEventListener("change",()=>{ if(fileIn.files[0]) load(fileIn.files[0]); });
$("reset").addEventListener("click",()=>location.reload());
$("prefix").addEventListener("input",updateExample);
$("dedupe").addEventListener("change",render);
$("export").addEventListener("click",exportParts);

function currentPlan(){ return plan(state.pages, $("dedupe").checked); }

async function load(file){
  setOut("Reading pages…");
  showProgress(0,0,"Reading pages…");
  const bytes = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  const pages = [];
  const numbers = new Set(); const titles = new Set();

  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale:1});
    const tc = await page.getTextContent();
    scanMeta(uprightItems(tc.items), numbers, titles);
    const rec = pageRecord(i, tc.items, vp.height, vp.width);

    // small thumbnail for the review table
    const tvp = page.getViewport({scale: 110/vp.width});
    const c = document.createElement("canvas"); c.width=tvp.width; c.height=tvp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:tvp}).promise;
    rec.thumb = c.toDataURL("image/jpeg",0.6);

    pages.push(rec);
    setOut(`Reading pages… ${i}/${pdf.numPages}`);
    showProgress(i, pdf.numPages, `Reading pages… ${i}/${pdf.numPages}`);
  }

  const nums = [...numbers].sort((a,b)=>a-b);
  const titleList = [...titles];
  state = { bytes, pages, nums, titleList, fileName:file.name };

  $("title").textContent = titleList.length ? titleList.join(" · ") : file.name;
  $("meta").innerHTML = `<b>${pages.length}</b> pages · piece ${nums.length>1?"numbers":"number"} <b>${nums.join(", ")||"not found"}</b>`;
  $("prefix").value = nums.length ? nums.join("-") : file.name.replace(/\.pdf$/i,"");
  $("summary").classList.remove("hidden"); $("review").classList.remove("hidden");
  drop.classList.add("hidden");
  hideProgress();
  setOut("");
  render(); updateExample();
}

function render(){
  const {groups,status} = currentPlan();
  const tb = $("rows"); tb.innerHTML="";
  for(const p of state.pages){
    const s = status[p.n];
    const tr = document.createElement("tr"); if(s.dropped) tr.className="dropped";
    const sel = document.createElement("select");
    // Only a page that resolves to nothing is flagged red; an inherited page is a normal outcome.
    sel.className = s.part?"":"warn";
    sel.add(new Option(INHERIT_LABEL,INHERIT));
    PARTS.forEach(([name])=>sel.add(new Option(name,name)));
    sel.add(new Option(SKIP_LABEL,SKIP));
    // Show the effective part, so an inherited page names the part it continues.
    sel.value = p.override===SKIP ? SKIP : (s.part||INHERIT);
    sel.addEventListener("change",()=>{ p.override = sel.value===INHERIT ? undefined : sel.value; render(); });
    tr.innerHTML = `<td class="n">${p.n}</td><td class="th"><img src="${p.thumb}" alt=""></td><td></td><td class="status ${s.dup?"dup":""}">${s.label}</td>`;
    tr.children[2].appendChild(sel);
    tb.appendChild(tr);
  }
  const missing = state.pages.filter(p=>!status[p.n].part && p.override!==SKIP).length;
  $("export").textContent = `Export ${groups.size} part${groups.size===1?"":"s"}`;
  $("export").disabled = groups.size===0;
  if(missing) setOut(`${missing} page${missing===1?"":"s"} not detected — set the part or it will be skipped.`,"err"); else setOut("");
}

function updateExample(){
  $("example").textContent = `e.g. ${safeName($("prefix").value)} – 1st Cornet Bb.pdf`;
}

function setOut(msg,cls){ const o=$("out"); o.textContent=msg; o.className="out "+(cls||""); }

// Load progress lives at the top of the page as well as in the status line: on a 79-page score
// the review card is far below the fold while the read runs, so #out alone tells nobody anything.
function showProgress(done,total,msg){
  $("progress").classList.remove("hidden");
  $("pbar").style.width = total ? `${Math.round(done/total*100)}%` : "0%";
  $("ptext").textContent = msg;
}
function hideProgress(){ $("progress").classList.add("hidden"); $("pbar").style.width="0%"; }

async function exportParts(){
  const {groups} = currentPlan();
  const prefix = safeName($("prefix").value)||"parts";
  $("export").disabled = true; setOut("Building files…");
  try{
    const src = await PDFLib.PDFDocument.load(state.bytes);
    const zip = new JSZip(); const list = $("files"); list.innerHTML="";
    const order = PARTS.map(p=>p[0]);
    const names = [...groups.keys()].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    for(const part of names){
      const pageNums = groups.get(part);
      const doc = await PDFLib.PDFDocument.create();
      const copied = await doc.copyPages(src, pageNums.map(n=>n-1));
      copied.forEach(pg=>doc.addPage(pg));
      doc.setTitle(`${prefix} – ${part}`);
      const fname = `${prefix} – ${part}.pdf`;
      zip.file(fname, await doc.save());
      const li=document.createElement("li"); li.innerHTML=`<b>${fname}</b> · ${pageNums.length} page${pageNums.length===1?"":"s"}`; list.appendChild(li);
    }
    const blob = await zip.generateAsync({type:"blob"});
    const zipName = `${prefix}.zip`;
    const done = `Exported ${names.length} part${names.length===1?"":"s"}.`;
    const download = () => {
      const url = URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=zipName;
      document.body.appendChild(a); a.click(); a.remove();
      // Hold the blob long enough for the click to start the download, then release it.
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      setOut(done,"ok");
    };
    const f = new File([blob], zipName, {type:"application/zip"});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f], title:zipName}); setOut(done,"ok"); }
      catch(e){
        // Dismissing the share sheet is a choice, not a failure. Anything else — the sheet refusing
        // the file, a permissions error, an iPadOS quirk — must still hand over the ZIP rather than
        // report "Export failed" to someone whose parts were built successfully.
        if(e.name === "AbortError"){ setOut("Export cancelled."); }
        else { console.warn("Share failed, falling back to download:", e); download(); }
      }
    }else{
      download();
    }
  }catch(e){
    console.error(e); setOut(`Export failed: ${e.message}`,"err");
  }finally{ $("export").disabled=false; }
}
</script>
</body>
</html>
