<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140F" media="(prefers-color-scheme: dark)">
<title>Part Splitter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* Vertical rhythm is an 8px grid: every margin, padding and gap below is a multiple of --u,
     so the page keeps one spacing scale instead of the assorted 4/6/14/18/22px it grew. */
  :root{
    color-scheme:light dark;
    --u:8px;
    --paper:#F6F3EC; --paper-2:#EFEAE0; --card:#FFFFFF;
    --ink:#1C1A17; --ink-2:#5C5750; --ink-3:#8A8378;
    --rule:#D6CFC0; --rule-soft:#E8E2D5; --stave:#B9B1A0;
    /* --red paints surfaces and carries white text; --red-text is the same idea sitting on paper.
       They are separate tokens only so dark mode can lighten one without wrecking contrast on the other. */
    --red:#8E1B2A; --red-text:#8E1B2A; --red-2:#B63A48; --red-tint:#FBF0F1; --red-line:#E0C0C5;
    --ok:#2E6B3E;
    --shadow:0 1px 2px rgba(28,26,23,.04), 0 6px 20px rgba(28,26,23,.05);
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#15140F; --paper-2:#1F1D17; --card:#1B1914;
      --ink:#EDE8DD; --ink-2:#ABA497; --ink-3:#7E776B;
      --rule:#3B3830; --rule-soft:#2B2922; --stave:#524D43;
      --red:#A8303F; --red-text:#E48B95; --red-2:#E07C86; --red-tint:#2B1A1D; --red-line:#5C333A;
      --ok:#7FC894;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .wrap{max-width:900px;margin:0 auto;padding:calc(var(--u)*4) calc(var(--u)*2.5);
        padding-bottom:calc(var(--u)*10 + env(safe-area-inset-bottom))}

  header{margin-bottom:calc(var(--u)*4)}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,38px);line-height:1.1;letter-spacing:-.01em;margin:0}
  h1 em{font-style:italic;color:var(--red-text)}
  .sub{color:var(--ink-2);font-size:15px;line-height:1.5;margin-top:var(--u);max-width:46ch}

  /* Load progress, kept at the top of the page: on a 79-page score the status line down in the
     review card is off-screen while the read is happening, which is exactly when it matters. */
  .progress{margin-bottom:calc(var(--u)*3)}
  .ptrack{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
  .pbar{height:100%;width:0;background:var(--red);border-radius:3px}
  @media (prefers-reduced-motion:no-preference){.pbar{transition:width .18s linear}}
  .ptext{margin-top:var(--u);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* Drop zone: a real five-line stave in the SVG below, brace sized to it, hairlines that stay
     hairlines at any width (non-scaling-stroke). The old version was a repeating-linear-gradient
     that clipped mid-line and read as stray rules. */
  .drop{position:relative;display:block;text-align:center;cursor:pointer;
        background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
        padding:calc(var(--u)*6) calc(var(--u)*3)}
  .drop.over{border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint)}
  .drop .stave{display:block;width:min(280px,78%);height:auto;margin:0 auto calc(var(--u)*3)}
  .drop .stave line,.drop .stave path{vector-effect:non-scaling-stroke}
  .drop .stave .ln{stroke:var(--stave);stroke-width:.9}
  .drop .stave .bar{stroke:var(--stave);stroke-width:1.2}
  .drop .stave .brace{stroke:var(--red-text);stroke-width:1.8;stroke-linecap:round;fill:none}
  .drop strong{display:block;font-family:var(--display);font-size:23px;font-weight:400;line-height:1.25}
  .drop span{display:block;color:var(--ink-2);font-size:14px;margin-top:var(--u)}
  .drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  @media (prefers-reduced-motion:no-preference){.drop{transition:border-color .15s,box-shadow .15s}}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
        padding:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
  .card h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2;margin:0 0 var(--u)}
  .meta{color:var(--ink-2);font-size:14px;line-height:1.5}
  .meta b{color:var(--ink);font-weight:600}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2) calc(var(--u)*3);margin-top:calc(var(--u)*3)}
  .opt label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;margin-bottom:var(--u)}
  .opt input[type=text]{width:100%;font:inherit;font-size:16px;padding:calc(var(--u)*1.5);border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
  .toggle{display:flex;align-items:center;gap:var(--u);font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);align-self:end;padding-bottom:calc(var(--u)*1.5)}
  .toggle input{width:20px;height:20px;flex:none;accent-color:var(--red)}
  .hint{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink-3);margin-top:var(--u);word-break:break-word}

  table{width:100%;border-collapse:collapse;margin-top:calc(var(--u)*2)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:left;padding:var(--u);border-bottom:1px solid var(--rule)}
  th.status,td.status{text-align:right}
  td{padding:calc(var(--u)*1.5) var(--u);border-bottom:1px solid var(--rule-soft);vertical-align:middle;font-size:15px}
  td.n{font-family:var(--mono);font-size:13px;color:var(--ink-3);width:44px;font-variant-numeric:tabular-nums}
  /* Fixed 3:4 box: portrait parts and landscape score pages letterbox into the same slot, so rows
     keep their height instead of jumping about as each thumbnail decodes. */
  th.th{width:72px}
  td.th img{width:54px;height:72px;object-fit:contain;object-position:center;border:1px solid var(--rule);border-radius:2px;display:block;background:#fff}
  select{font:inherit;font-size:15px;padding:calc(var(--u)*1.25) calc(var(--u)*1.5);border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
  /* "Not detected" has to be unmissable without shouting: a tinted field and a red edge, no siren. */
  select.warn{border-color:var(--red-line);background:var(--red-tint);color:var(--red-text)}
  td.status{font-size:13px;color:var(--ink-2);width:120px;white-space:nowrap;font-variant-numeric:tabular-nums}
  td.status.dup{color:var(--ink-3)}
  tr:has(select.warn) td.status{color:var(--red-text);font-weight:600}
  tr.dropped td.n,tr.dropped td.th,tr.dropped td.status{opacity:.55}
  tr.dropped td.th img{opacity:.55}

  .actions{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.5);align-items:center;margin-top:calc(var(--u)*3)}
  /* One primary. Everything else is a quiet outline so the eye lands on Export. */
  button{font:inherit;font-size:16px;font-weight:500;padding:calc(var(--u)*1.5) calc(var(--u)*2.5);border-radius:8px;
         border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  button.quiet{background:transparent;color:var(--ink-2)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-within{outline:3px solid var(--red-2);outline-offset:2px}
  .out{font-size:14px;line-height:1.4;color:var(--ink-2)}
  .out.ok{color:var(--ok)}
  .out.err{color:var(--red-text)}
  .files{margin:calc(var(--u)*2) 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:13px}
  /* Quiet enough to ignore, legible enough to read out over the phone when a tester reports a bug. */
  .build{margin:calc(var(--u)*3) 0 calc(var(--u)*2);text-align:center;font-family:var(--mono);
    font-size:12px;color:var(--ink-2);opacity:.7;user-select:all}
  .files li{padding:var(--u) 0;border-bottom:1px solid var(--rule-soft);word-break:break-word}
  .files li b{font-weight:600;color:var(--ink)}
  .hidden{display:none}

  @media (max-width:600px){
    .opts{grid-template-columns:1fr}
    .toggle{align-self:start;padding-bottom:0}
  }
  /* Phones: the four columns cannot survive 480px, so each page becomes a card — thumbnail on the
     left (it is the whole point of the review step, so it stays visible), page number and status on
     one line, the part dropdown full width underneath. */
  @media (max-width:480px){
    .wrap{padding-left:calc(var(--u)*2);padding-right:calc(var(--u)*2)}
    .card{padding:calc(var(--u)*2.5) calc(var(--u)*2)}
    table,tbody,tr,td{display:block;width:auto}
    thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    tr{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-areas:"thumb head" "thumb part";
       column-gap:calc(var(--u)*1.5);row-gap:var(--u);align-items:center;
       padding:calc(var(--u)*2) 0;border-bottom:1px solid var(--rule-soft)}
    td{border:0;padding:0}
    td.n{grid-area:head;width:auto;align-self:end}
    td.n::after{content:""}
    td.th{grid-area:thumb;align-self:start}
    td.th img{width:64px;height:85px}
    tr>td:nth-child(3){grid-area:part}
    tr>td:nth-child(3) select{width:100%}
    td.status{grid-area:head;width:auto;text-align:right;align-self:end}
    .actions{gap:var(--u)}
    .actions button{flex:1 1 auto}
    .actions .out{flex:1 0 100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Part <em>Splitter</em></h1>
    <div class="sub">Turn a set-of-parts PDF into one file per part. Everything runs on this device; nothing is uploaded.</div>
  </header>

  <div class="progress hidden" id="progress" role="status" aria-live="polite">
    <div class="ptrack"><div class="pbar" id="pbar"></div></div>
    <div class="ptext" id="ptext"></div>
  </div>

  <label class="drop" id="drop">
    <svg class="stave" viewBox="0 0 264 48" aria-hidden="true" focusable="false">
      <path class="brace" d="M17 6 C 10 13, 15 20, 8 24 C 15 28, 10 35, 17 42"/>
      <g class="ln-group">
        <line class="ln" x1="24" y1="8" x2="256" y2="8"/>
        <line class="ln" x1="24" y1="16" x2="256" y2="16"/>
        <line class="ln" x1="24" y1="24" x2="256" y2="24"/>
        <line class="ln" x1="24" y1="32" x2="256" y2="32"/>
        <line class="ln" x1="24" y1="40" x2="256" y2="40"/>
      </g>
      <line class="bar" x1="24" y1="8" x2="24" y2="40"/>
      <line class="bar" x1="256" y1="8" x2="256" y2="40"/>
    </svg>
    <strong>Choose a set-of-parts PDF</strong>
    <span>Tap to pick from Files, or drop a PDF here</span>
    <input type="file" id="file" accept="application/pdf,.pdf">
  </label>

  <section class="card hidden" id="summary">
    <h2 id="title">—</h2>
    <div class="meta" id="meta"></div>
    <div class="opts">
      <div class="opt">
        <label for="prefix">Filename prefix</label>
        <input type="text" id="prefix" autocapitalize="off" autocorrect="off">
        <div class="hint" id="example"></div>
      </div>
      <div class="opt">
        <label class="toggle"><input type="checkbox" id="dedupe" checked> Drop duplicate copies of a page</label>
      </div>
    </div>
  </section>

  <section class="card hidden" id="review">
    <h2>Check each page</h2>
    <div class="meta">Detected from the page header. Fix any that are wrong before exporting.</div>
    <table>
      <thead><tr><th>Pg</th><th class="th"></th><th>Part</th><th class="status">Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="actions">
      <button class="primary" id="export">Export parts</button>
      <button class="quiet" id="reset">Start over</button>
      <span class="out" id="out"></span>
    </div>
    <ul class="files" id="files"></ul>
  </section>
  <!-- Build stamp. tools/stamp.mjs rewrites the span's text, and nothing else on the line; the
       markers are what it anchors to, so leave them alone. -->
  <footer class="build">build <span id="build"><!--BUILD-->f3152a2 · 2026-09-02<!--/BUILD--></span></footer>
</div>

<script id="core">
/* Detection and planning logic. No DOM, no pdf.js API calls, no browser globals — tools/map.mjs
   pulls this exact block out of index.html and runs it in Node, so the harness tests shipped code. */

// Canonical part list, in band order. Each has one or more regexes tested on normalised header text.
const PARTS = [
  ["Full Score",        [/\bFULL SCORE\b/, /(?<!PERCUSSION\s{0,3})\bSCORE\b/, /\bCONDUCTOR\b/]],
  ["Flute/Oboe",        [/\bFLUTE\b/, /\bOBOE\b/]],
  ["Soprano Eb",        [/\bSOPRANO\b/]],
  ["Solo Cornet Bb",    [/\bSOLO CORNET/]],
  ["Repiano Cornet Bb", [/\bREPIANO/]],
  ["1st Cornet Bb",     [/\b1ST CORNET/]],
  ["2nd Cornet Bb",     [/\b2ND CORNET/]],
  ["3rd Cornet Bb",     [/\b3RD CORNET/]],
  ["Flugel Horn Bb",    [/\bFLUGEL/]],
  ["Solo Horn Eb",      [/\bSOLO HORN/]],
  ["1st Horn Eb",       [/\b1ST HORN/]],
  ["2nd Horn Eb",       [/\b2ND HORN/]],
  ["1st Horn F",        [/\b1ST\.?\s*F\.?\s*HORN\b/, /\b1ST HORN F\b/]],
  ["2nd Horn F",        [/\b2ND\.?\s*F\.?\s*HORN\b/, /\b2ND HORN F\b/]],
  ["1st Baritone Bb",   [/\b1ST BARITONE/]],
  ["2nd Baritone Bb",   [/\b2ND BARITONE/]],
  ["Baritone Bb",       [/\bBARITONE B ?B\b/]],
  ["1st Baritone B.C.", [/\b1ST\.?\s*BARITONE\b.{0,60}?\bB\.C\./]],
  ["2nd Baritone B.C.", [/\b2ND\.?\s*BARITONE\b.{0,60}?\bB\.C\./]],
  ["Baritone B.C.",     [/\bBARITONE\b.{0,60}?\bB\.C\./]],
  ["1st Trombone Bb",   [/\b1ST TROMBONE/]],
  ["2nd Trombone Bb",   [/\b2ND TROMBONE/]],
  ["Bass Trombone",     [/\bBASS TROMBONE/]],
  ["Euphonium Bb",      [/\bEUPHONIUM/]],
  ["Euphonium B.C.",    [/\bEUPHONIUM\b.{0,60}?\bB\.C\./]],
  ["Bass Eb",           [/\bBASS (?:IN )?E ?B\b/, /\bE ?B BASS\b/]],
  ["Bass Bb",           [/\bBASS (?:IN )?B ?B\b/, /\bB ?B BASS\b/]],
  ["Tuba B.C.",         [/\bTUBA\b.{0,60}?\bB\.C\./, /\bTUBA\b/]],
  ["String Bass",       [/\bSTRING\s*\/?\s*ELECTRIC BASS\b/, /\bSTRING BASS\b/]],
  ["Percussion Score",  [/\bPERCUSSION\b(?:(?!\b(?:I|II|1|2)\b).){0,40}?\bSCORE\b/]],
  ["Percussion I",      [/\bPERCUSSION\s*(I|1)\b(?!I)/]],
  ["Percussion II",     [/\bPERCUSSION\s*(II|2)\b/]],
  ["Timpani",           [/\bTIMP/]],
  ["Drums",             [/\bDRUM/]],
];
const INHERIT = "";            // dropdown: no explicit choice, continue the previous page
const SKIP = "__skip__";       // dropdown: leave this page out entirely
const INHERIT_LABEL = "— inherit from previous page —";
const SKIP_LABEL = "Skip this page";

function norm(s){
  return s.replace(/[♭𝄫]/g,"b").replace(/♯/g,"#").toUpperCase().replace(/\s+/g," ").trim();
}
// A set sometimes prints one part for two instruments: "Baritone/Trombone", "1st Baritone/2nd
// Trombone Bb", "2nd Baritone/Trombone B.C.". That is one part in the set and has to come out as one
// file under the label the page prints. PARTS alone cannot do it — "1st Baritone B.C." is written
// with a 60-character tolerance that reaches straight across "/Trombone" to the trailing clef, so
// the shared part lands silently inside the Baritone's own file. The shape is recognised
// generically rather than by listing the combinations a publisher might print: an optional ordinal,
// an instrument, a joiner, an optional second ordinal, a second instrument, an optional key or clef.
const ORD  = "(?:(1ST|2ND|3RD|4TH|SOLO|REPIANO)\\.?\\s*)?";
// Ends on a lookahead so the name has to be a whole word: "BASS" must not match inside "BASSES",
// which is a word the prose on a notes page uses.
const INST = "(FLUTE|OBOE|CLARINET|SOPRANO|CORNET|FLUGEL(?: HORN)?|HORN|BARITONE|TROMBONE|EUPHONIUM|TUBA|BASS|TIMPANI|DRUMS|PERCUSSION)(?![A-Z])";
// Ends on a lookahead rather than \b, because "B.C." ends in a full stop and \b would never fire.
const KEY  = "(?:\\s*(?:IN )?(B ?B|E ?B|B\\.C\\.|T\\.C\\.|F)(?![A-Z0-9]))?";
// The two halves are not adjacent in reading order on any of the local sets: the label wraps to a
// second line and the centred piece title is read between them, so p.13 of multipage.pdf arrives as
// "1st Baritone/" · "Christmas Encore Medley" · "Trombone B" · "b". A bounded run of other text is
// therefore allowed after the joiner, the same tolerance the B.C. entries in PARTS already carry.
// It is allowed only there: the joiner itself must sit against the first instrument, which is what
// keeps prose like "Words/Music: …" out.
// The gap is lazily optional — tried only after a second instrument fails to follow the joiner
// directly — so that in "1st Baritone/2nd Trombone" the second ordinal is read as an ordinal and
// not swallowed as filler.
//
// A third joiner: the Unity Series prints "BARITONE or TROMBONE Bb". It is spelled as a whole word
// between spaces, so it can never match inside "Tenor" or "Horn" — and the instrument before it
// ends on a lookahead that rules out a letter, so "BARITONEOR" is not a joiner either. Unlike the
// punctuation joiners it takes no gap after it: a slash is what a set prints at a line break, and
// every "or" label seen sits on one line, so allowing 40 characters of drift there would only let
// prose like "extra percussion or vocal shouts" reach for a distant instrument.
const COMBINED_SRC = `\\b${ORD}${INST}(?:\\s*([/&])\\s*(?:\\S.{0,40}?\\s)??|\\s+(OR)\\s+)${ORD}${INST}${KEY}`;
const COMBINED = new RegExp(COMBINED_SRC);
const COMBINED_ALL = new RegExp(COMBINED_SRC, "g");
// A shared part is not always printed as two instrument names. "String/Electric Bass" is one part
// for two players, and neither half names an instrument on its own: the first is a bare qualifier
// and the second qualifies the instrument that ends the label. That shape is admitted on three
// conditions — the joiner is printed tight, with no space on either side; the span ends on a known
// instrument and its optional key; and each bare word is a word, three letters or more. Those are
// what keep the repeat-slash glyphs on a percussion page, "3/4 time" and "Words/Music:" out, none
// of which put a real word tight against the joiner and an instrument immediately after it.
const WORD = "([A-Z][A-Z]{2,})";
const QUALIFIED_SRC = `\\b${WORD}([/&])(?:${WORD} )?${INST}${KEY}`;
const QUALIFIED = new RegExp(QUALIFIED_SRC);
const QUALIFIED_ALL = new RegExp(QUALIFIED_SRC, "g");
// A Unity Series set ends with a family of parts named by number and key rather than by instrument:
// "PART I in C", "PART III in F", "PART III in C". They are open parts, playable on anything pitched
// that way, and each numeral-and-key pair is a part of its own — III in F and III in C are two
// different parts, not one printed twice. Recognised by shape rather than by listing the six the
// local set happens to print. Roman numerals are ordered longest-first so "III" cannot match as "I".
const NUMERAL = "(VIII|VII|VI|IV|V|III|II|I|[1-9])";
const IN_KEY  = "(B ?B|E ?B|C|F)";
const PART_IN_SRC = `\\bPART\\s+${NUMERAL}\\s+IN\\s+${IN_KEY}(?![A-Z0-9])`;
const PART_IN = new RegExp(PART_IN_SRC);
const PART_IN_ALL = new RegExp(PART_IN_SRC, "g");
const KEY_NAME = new Map([["BB","Bb"],["EB","Eb"],["F","F"],["B.C.","B.C."],["T.C.","T.C."]]);
// Concert pitch first, then the flat keys in the order a band sheet lists them. Sort order only.
const KEY_ORDER = ["C", "F", "Bb", "Eb"];
function titleCase(s){ return s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()); }
function keyName(k){ return k ? " " + (KEY_NAME.get(k.replace(/\s+/g,"")) || k) : ""; }
// The printed label, tidied: both halves in the order printed, one slash, and the ordinals and key
// spelled the way the rest of the app spells them. Rebuilt from the captures rather than taken as a
// raw span, because the raw span may have the piece title sitting inside it.
function combinedName(m){
  const half = (ord, inst) => (ord ? titleCase(ord) + " " : "") + titleCase(inst);
  // The joiner is kept as printed: a set that prints "Baritone & Trombone" or "Baritone or
  // Trombone" gets that name back rather than a slash it never printed.
  const join = m[4] ? " or " : m[3] === "&" ? " & " : "/";
  return `${half(m[1], m[2])}${join}${half(m[5], m[6])}${keyName(m[7])}`;
}
// The first of the two instruments, named the way PARTS names it. Only used for sort order.
function combinedFirst(m){ return (m[1] ? titleCase(m[1]) + " " : "") + titleCase(m[2]) + keyName(m[7]); }
// The same two, for the qualifier shape: "STRING/ELECTRIC BASS" -> "String/Electric Bass", whose
// first half is the bare qualifier "String".
function qualifiedName(m){
  const join = m[2] === "&" ? " & " : "/";
  return `${titleCase(m[1])}${join}${m[3] ? titleCase(m[3]) + " " : ""}${titleCase(m[4])}${keyName(m[5])}`;
}
function qualifiedFirst(m){ return titleCase(m[1]); }
const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
const ROMAN_VALUE = new Map(ROMAN.map((r, i) => [r, i]).slice(1));
function numeralValue(n){ return ROMAN_VALUE.get(n) || Number(n) || 0; }
// "PART III in F" and "PART 3 in F" are the same part, so the numeral is normalised to Roman rather
// than kept as printed: a set printed either way yields one part under one filename. The key is
// spelled the way every other part name spells it.
function partInKeyName(m){
  const n = numeralValue(m[1]);
  return `Part ${ROMAN[n] || m[1]} in ${KEY_NAME.get(m[2].replace(/\s+/g,"")) || m[2]}`;
}
// Read as a match of either shape: a span the same length means the same label seen two ways, and
// the two-instrument reading is the more specific of the two, so it is preferred.
function readCombined(m, name, first){ return { name:name(m), first:first(m), index:m.index, length:m[0].length }; }
function matchCombined(h){
  const a = COMBINED.exec(h), b = QUALIFIED.exec(h);
  const hit = a && (!b || b[0].length <= a[0].length) ? readCombined(a, combinedName, combinedFirst)
            : b ? readCombined(b, qualifiedName, qualifiedFirst) : null;
  return hit;
}
function matchPartInKey(h){
  const m = PART_IN.exec(h);
  return m ? { name:partInKeyName(m), first:null, index:m.index, length:m[0].length } : null;
}
// Every label that is recognised by shape rather than by a PARTS entry. The longer span wins, since
// the two shapes describe different labels and cannot both be right about the same one.
function matchShaped(h){
  const c = matchCombined(h), p = matchPartInKey(h);
  return c && (!p || p.length <= c.length) ? c : p;
}
// Band order for one part name. PARTS is the order; a combined part is not in PARTS, so it sits
// immediately after the first of its two instruments — "1st Baritone/Trombone Bb" files next to
// "1st Baritone Bb" rather than at the end of the band. Anything else sorts to the end.
function partOrder(name){
  const i = PARTS.findIndex(p => p[0] === name);
  if(i >= 0) return i;
  // The Part-in-Key family sorts as one block, after every instrument part and before percussion,
  // ordered by numeral and then by key. The block sits in the gap below the first percussion entry,
  // which leaves room for the shared parts that file at whole-number-plus-a-half.
  const k = matchPartInKey(norm(name));
  if(k){
    const m = PART_IN.exec(norm(name));
    const perc = PARTS.findIndex(p => p[0] === "Percussion Score");
    const key = [...KEY_ORDER].indexOf(KEY_NAME.get(m[2].replace(/\s+/g,"")) || m[2]);
    return (perc < 0 ? PARTS.length : perc) - 0.4 + numeralValue(m[1]) * 0.01 + Math.max(key, 0) * 0.001;
  }
  const c = matchCombined(norm(name));
  if(c){
    const exact = PARTS.findIndex(p => p[0] === c.first);
    if(exact >= 0) return exact + 0.5;
    // No entry for that half on its own (a set printing a bare "Baritone/Trombone" has no plain
    // "Baritone" in PARTS): fall in beside the first entry that names the same instrument.
    const head = norm(c.first).replace(/ (?:B ?B|E ?B|B\.C\.|T\.C\.|F)$/, "");
    const near = PARTS.findIndex(p => norm(p[0]).startsWith(head));
    if(near >= 0) return near + 0.5;
  }
  return PARTS.length;
}
// The dropdown offers the canonical parts plus any combined part this document actually prints: a
// shared part is not in PARTS, so without this its own page could not select the label it carries.
function partOptions(pages){
  const extra = new Set();
  for(const p of pages){
    for(const name of [p.detected, p.override]){
      if(name && name !== SKIP && !PARTS.some(x => x[0] === name)) extra.add(name);
    }
  }
  return [...PARTS.map(p => p[0]), ...extra].sort((a,b) => partOrder(a) - partOrder(b));
}

// Return the part whose regex matches the longest span of h, so a qualified label beats the plain one
// it contains: "2nd Baritone/Trombone B.C." must not settle for "2nd Baritone". Ties keep the earlier
// entry, which preserves the band-order preference the list has always encoded.
function matchPart(h){
  let best=null, bestLen=0;
  for(const [name,res] of PARTS) for(const r of res){
    const m = h.match(r);
    if(m && m[0].length > bestLen){ best=name; bestLen=m[0].length; }
  }
  // A shaped label outranks a PARTS entry at equal length as well as at greater length: a combined
  // label's span starts on the same word as its half's, and "1st Baritone B.C." ends on the very
  // same clef as "1st Baritone/Trombone B.C.", so a strictly-longer test would keep the half.
  const c = matchShaped(h);
  return c && c.length >= bestLen ? c.name : best;
}
function readingOrder(items){
  return [...items].sort((a,b)=>(b.transform[5]-a.transform[5])||(a.transform[4]-b.transform[4]));
}

// Some engravers emit one text item per glyph, so "Soprano" arrives as S,o,p,r,a,n,o and no part regex
// can ever match. Stitch runs of single-character items back into words using the horizontal gap
// between them, measured as a fraction of the font size: on the local fixtures gaps inside a word reach
// 0.06 and gaps between words start at 0.20, so 0.12 sits in the empty band between the two. Items that
// already carry whole words are passed through untouched, which leaves normally-engraved sets exactly
// as they were. Music glyphs stay separate because they are spread across the stave, far past the gap.
const GLYPH_GAP = 0.12;
function stitch(items){
  const words = [];
  for(const it of readingOrder(items)){
    const last = words[words.length-1];
    const single = it.str.trim().length === 1;
    const size = Math.abs(it.transform[0]), x = it.transform[4], y = it.transform[5], w = it.width||0;
    // The gap is bounded on both sides: a negative gap means the next glyph sits left of the previous
    // one, which is a second column sharing a baseline (composer credit beside a part label), not a word.
    const gap = x - (last ? last.x + last.w : 0);
    if(last && last.glyphs && single && Math.abs(y-last.y) < 1 && Math.abs(gap) < GLYPH_GAP*size){
      last.str += it.str; last.w = x + w - last.x;   // run continues; still counts as glyph-built
      continue;
    }
    words.push({str:it.str, size, x, y, w, glyphs:single});
  }
  return words;
}
function textOf(words){ return words.map(w=>w.str).join(" "); }

// The part label is the first thing top-left. Read words in reading order and take the earliest match,
// so instrument cues further down the header (e.g. "Bass Eb" on a Bass Bb part) can't hijack detection.
// Once something matches, keep reading a few more words: qualifiers trail their base name, and the
// accumulator would otherwise commit to "2nd Baritone" before "B.C." had even been read. Only a
// strictly longer match displaces the incumbent, so a later cue cannot take over on equal footing.
const LOOKAHEAD = 4;
// Abbreviations run down the left margin of a score page: Sop., Solo Cor., 1st Hn. Both readings of
// the column share one vocabulary — the weak-evidence test below, and the page-level signal further
// down. BARI comes before BAR so that "1st Bari." is read as the abbreviation it is rather than
// failing on the trailing "I"; the alternation is anchored, so the longer word has to be tried first.
const ABBREV_WORD = "(SOP|COR|HN|BARI|BAR|TROM|TBN|EUPH|PERC)";
const ABBREV = new RegExp(`\\b${ABBREV_WORD}\\.?$`);
function detectPart(items){
  let acc="", best=null, bestLen=0, after=-1, ev=null;
  for(const w of stitch(items)){
    acc += " "+w.str;
    const h = norm(acc);
    for(const [name,res] of PARTS) for(const r of res){
      const m = h.match(r);
      if(m && m[0].length > bestLen){ best=name; bestLen=m[0].length; ev=w; if(after<0) after=0; }
    }
    // Same equal-length preference as matchPart: the shared part outranks either of its halves.
    const c = matchShaped(h);
    if(c && c.length >= bestLen){ best=c.name; bestLen=c.length; ev=w; if(after<0) after=0; }
    if(after>=0 && ++after > LOOKAHEAD) break;
  }
  // Weak evidence is a match that does not look like a part label: the small type of a score's
  // instrument column, an abbreviation from that column, or a word swallowed by a prose paragraph.
  const weak = !!ev && (ev.size < 9 || ABBREV.test(norm(ev.str)) || ev.str.length > 40);
  return {part:best, weak};
}
function safeName(s){ return s.replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g," ").trim(); }

// transform[1] !== 0 means rotated text — the licence stamp down the right edge. Always ignored.
function uprightItems(items){ return items.filter(it=>Math.abs(it.transform[1])<0.01 && it.str.trim()); }
// transform[5] is y, measured bottom-up, so the header band is the top 20% of the page.
function headerItems(upright, vpHeight){ return upright.filter(it=>it.transform[5] > vpHeight*0.80); }

// A score page names every instrument in the band down its left margin, so it matches many part
// labels at once where a part page matches only its own. Counting NON-OVERLAPPING matched regions
// keeps three regexes hitting one "2nd Baritone/Trombone B.C." label from reading as three
// instruments. Measured over all three fixtures, 116 pages: every part page matches at most 2, while
// the score pages match 5 and 12. Four sits in that empty band. This is a page-level signal and does
// not care how big the labels are, which is the case the weak-evidence test cannot see.
const SCORE_LABELS = 4;
function labelCount(items){
  // Normalised word by word, and joined the same way textOf does, so h is exactly what
  // norm(textOf(stitch(items))) used to be — a word that normalises to nothing would add a stray
  // space, so those are dropped. Keeping the word boundaries lets a match be traced back to the
  // text item it started in, which is what the prose test below needs.
  const words = stitch(items).map(w => ({str:w.str, n:norm(w.str)})).filter(w => w.n);
  const h = words.map(w => w.n).join(" ");
  const at = []; let o = 0;
  for(const w of words){ at.push(o); o += w.n.length + 1; }
  const wordAt = i => { let k = 0; while(k+1 < at.length && at[k+1] <= i) k++; return words[k]; };
  const spans = [];
  // Combined labels are collected first so that where a span starts on the same word as one of its
  // halves, the sort below — which is stable — leaves the combined span in front and the half is
  // dropped as an overlap. "1st Baritone/2nd Trombone" is one instrument on the page, not two.
  for(const [all, name] of [[COMBINED_ALL, combinedName], [QUALIFIED_ALL, qualifiedName], [PART_IN_ALL, partInKeyName]])
  for(const m of h.matchAll(all)){
    // A shared part is a label, not a sentence. score.pdf's notes page discusses "Trombone/Baritone
    // in Bar 36" inside one long prose item; counting that as an instrument could tip a parts page
    // over the score threshold. Same 40-character prose test the weak-evidence check uses.
    const w = wordAt(m.index);
    if(w && w.str.length > 40) continue;
    spans.push([m.index, m.index + m[0].length, name(m)]);
  }
  for(const [name,res] of PARTS) for(const r of res){
    const m = h.match(r);
    if(m) spans.push([m.index, m.index + m[0].length, name]);
  }
  spans.sort((a,b)=>a[0]-b[0]);
  // Drop spans that overlap one already counted, then count distinct instruments among what is left:
  // one label matched by three regexes is one instrument, and one instrument named in two places on a
  // page (a part's own label plus a cue) is still one instrument.
  const seen = new Set();
  let end = -1;
  for(const [from,to,name] of spans) if(from >= end){ seen.add(name); end = to; }
  return seen.size;
}

// A second, independent way to read a score page. `labelCount` only ever sees a stave whose name is
// spelled out, and a Maple Leaf Brass score spells out two of fifteen: after its first page the column
// reads "Sop. Cor. · 1st Cor. · 2nd Cor. · 1st Hn · 2nd Hn · 1st Bari. · 2nd Bari. · 1st Tbn. ·
// 2nd Tbn. · B. Tbn. · Euph. · Bass Eb · Bass Bb · Perc. 1 · Perc. 2". Those pages read as two labels,
// which is what a part page reads, and nothing about the page size separates them either — this set is
// portrait throughout, score and parts alike. So the abbreviated column is counted on its own terms.
//
// It is a page-level signal and nothing more: an abbreviation still names no part, here or anywhere
// else. What it decides is that the page is a score page, and `plan` files a score page under Full
// Score ahead of whatever its header detected — which is what keeps the two spelled-out staves in that
// column, Bass Eb and Bass Bb, from claiming the page.
//
// "In a column" is two measured things: the label sits in the left quarter of the page, and it is set
// in the small type a stave name is set in. Both matter — dropping them lets the cue abbreviations
// printed over the music ("Bar.", "B. Trom." above a rest bar) into the count, which takes the worst
// part page in the fixtures from 3 to 4.
const COLUMN_X = 0.25;    // stave labels sit at x = 42-52 of a 612pt page; cue labels sit over the music
const COLUMN_PT = 9;      // the same bound the weak-evidence test uses to tell a stave name from a title
// A stave label may carry a number: "Perc. 1", "Perc. 2".
const ABBREV_STAVE = new RegExp(`\\b${ABBREV_WORD}\\.?(?:\\s*(?:\\d+|I{1,3}))?$`);
function abbrevColumn(upright, vpWidth){
  const seen = new Set();
  for(const it of upright){
    const s = it.str.trim();
    // Two letters, so the single glyphs a notation font scatters down the margin — clefs, braces,
    // accidentals — cannot be read as words.
    if((s.match(/[A-Za-z]/g) || []).length < 2) continue;
    if(it.transform[4] > vpWidth * COLUMN_X) continue;
    if(Math.abs(it.transform[0]) >= COLUMN_PT) continue;
    const n = norm(s);
    if(ABBREV_STAVE.test(n)) seen.add(n);
  }
  // Distinct labels, not staves: "1st Cor." and "2nd Cor." are two, and one name printed twice is one.
  return seen.size;
}
// Measured over all eight fixtures, 428 pages, the same way SCORE_LABELS was: every page that is not a
// score page counts at most 3 (encore.pdf p.35 and multipage.pdf p.13, each a Baritone/Trombone part
// carrying "Bar.", "Trom." and "B. Trom." cues), and every abbreviated score page counts 13. Six is
// double the first number and under half the second, with three clear below it and seven clear above.
const SCORE_ABBREVS = 6;

// A part's first page carries a title block; its continuation pages carry only a small running head.
// Measured across the local fixtures: title blocks are set at 15.5-24pt and running heads at 8-10pt,
// so 12pt sits in a wide empty gap. Music glyphs are excluded by requiring a letter and two characters
// (notation fonts emit single non-letter glyphs at large sizes).
const FIRST_PAGE_PT = 12;
function titleSize(words){
  const lettered = words.filter(w=>/[A-Za-z]{3,}/.test(w.str));
  return lettered.length ? Math.max(...lettered.map(w=>w.size)) : 0;
}
// A page that opens a new part must never continue the previous one, even when its own label is
// unrecognised — inheriting there would silently file it under the wrong neighbour. A piece number
// or a title block in the header both mean "this page starts something".
function hasPieceNumber(words){
  return words.some(w=>/^No\.?\s*\d{2,5}$/i.test(w.str.trim()) && w.size>=11);
}
function isFirstPage(words){
  return hasPieceNumber(words) || titleSize(words) >= FIRST_PAGE_PT;
}

// A score-fronted set opens with a cover, and often a prose notes page, carrying nothing the header
// detector recognises — on both local score-fronted fixtures the cover's title, composer and series
// line all sit at 40-60% page height, well below the 20% header band, so the page reads as empty.
// Those pages are the score's front matter, not junk. The default below is deliberately narrow: it
// fires only on a run starting at page 1, only when the document turned out to have a Full Score at
// all (a plain set of parts with a junk first page must not invent one), and only up to COVER_MAX
// pages, because a longer unassigned run means something else is wrong and should stay visible.
const COVER_MAX = 3;

// The cover's own text is nowhere near the header band, so anything that reads it — series naming
// below — needs the whole page. Item boundaries and font sizes both matter and p.key throws away
// both, so keep a reduced copy. Only the pages that can ever be front matter keep one: a 79-page
// set would otherwise carry every glyph of every score page around for nothing.
function coverItems(upright){
  return upright
    .map(it => ({ str: it.str.trim(), size: Math.abs(it.transform[0]), y: it.transform[5] }))
    .filter(i => i.str);
}

// Everything the app knows about a page before the user touches anything.
function pageRecord(n, items, vpHeight, vpWidth){
  const upright = uprightItems(items);
  const header = headerItems(upright, vpHeight);
  const headerWords = stitch(header);
  const hit = detectPart(header);
  const labels = labelCount(upright);
  const staves = abbrevColumn(upright, vpWidth);
  return {
    n,
    labels,                         // distinct part labels on the page; many means a score
    staves,                         // distinct abbreviated stave labels down the left margin
    // Either reading of the column is enough on its own: a score names its band in full on its first
    // page and by abbreviation on the rest, and a set may print only one of the two.
    score: labels >= SCORE_LABELS || staves >= SCORE_ABBREVS,
    detected: hit.part,             // what the header says; never changes after load
    weak: hit.weak,                 // the match does not look like a part label
    override: undefined,            // what the user chose in the dropdown, if anything
    first: isFirstPage(headerWords),// opens a new part, so it may not inherit
    number: hasPieceNumber(headerWords),
    size: `${Math.round(vpWidth)}x${Math.round(vpHeight)}`,
    cover: n <= COVER_MAX ? coverItems(upright) : null,
    header: textOf(headerWords),
    key: norm(textOf(stitch(upright))),
  };
}

// Piece numbers and titles can sit anywhere on the page (several pieces per page), so scan the whole page.
function scanMeta(upright, numbers, titles){
  upright.forEach(it=>{
    const t=it.str.trim(); const size=it.transform[0];
    const m=t.match(/^No\.?\s*(\d{2,5})$/i); if(m && size>=11){ numbers.add(m[1]); return; }
    if(size>=14 && /^[A-Z][A-Z0-9 .'’,&!:-]{3,}$/.test(t)) titles.add(t);
  });
}

// Resolve each page to an effective part, in page order, then group.
//
// A page with no label of its own continues the previous page's part, which is how two- and
// three-page parts stay together. Inheritance deliberately follows the previous page's part even
// when that page was dropped as a duplicate: a two-copy two-page part arrives A1 A2 A1 A2, and the
// second A2 has to inherit "A" before the dedupe key can recognise it as a copy of the first A2.
// An explicit Skip breaks the chain — the page after it has nothing to continue.
function plan(pages, dedupe){
  const groups = new Map(); const seen = new Map();
  const status = [];
  let carried = null;   // effective part of the previous page
  let source = 0;       // page that last carried a part of its own, for the "cont. of p.N" label
  let runSize = null;   // page size the current part started on
  const leading = []; let leadingOpen = true;   // pages 1..k that resolved to nothing at all
  for(const p of pages){
    // A full score runs for many pages and only the first is labelled. Inside that run the title block
    // cannot mark a first page — every score page repeats the title — so the run is bounded by page
    // size instead, which is what actually separates a landscape score from the portrait parts behind
    // it, and by the piece number the brief calls out. While the run holds, weak matches from the
    // score's own instrument column are ignored rather than starting a bogus part.
    const scoreRun = carried === "Full Score" && p.size === runSize && !p.number;
    let part = null, inherited = false;
    if(p.override === SKIP)   part = null;
    else if(p.override)       part = p.override;
    // Takes precedence over detection: a score page carries real, full-size part labels, and one of
    // them would otherwise win outright. Only an explicit choice in the dropdown outranks it.
    else if(p.score)          part = "Full Score";
    else if(p.detected && !(scoreRun && p.weak)) part = p.detected;
    else if(carried && (!p.first || scoreRun)){ part = carried; inherited = true; }

    if(part && !inherited){ source = p.n; runSize = p.size; }
    carried = part;

    // The leading run ends at the first page that resolves to something, and at any page the user
    // has spoken for — an explicit part or Skip outranks the default, so neither joins the run.
    if(leadingOpen){
      if(part || p.override !== undefined) leadingOpen = false;
      else leading.push(p.n);
    }

    if(!part){ status[p.n]={dropped:true,label:"skipped",part:null,inherited:false}; continue; }
    const base = {part, inherited, from: inherited ? source : 0};
    const k = part+"§"+p.key;
    if(dedupe && seen.has(k)){ status[p.n]={...base,dropped:true,label:`copy of p.${seen.get(k)}`,dup:true}; continue; }
    seen.set(k,p.n);
    if(!groups.has(part)) groups.set(part,[]);
    groups.get(part).push(p.n);
    status[p.n]={...base,dropped:false,label: inherited ? `cont. of p.${source}` : "keep"};
  }

  // Front matter joins the score. Prepended in document order, and never deduped: a cover is by
  // definition a page the pipeline recognises nothing on, so a dedupe key match would be a
  // coincidence, and losing a cover is worse than carrying two.
  const score = groups.get("Full Score");
  if(score && leading.length && leading.length <= COVER_MAX){
    for(let i=leading.length-1; i>=0; i--){
      const n = leading[i];
      score.unshift(n);
      status[n] = {part:"Full Score", inherited:false, from:0, dropped:false, label:"cover → Full Score"};
    }
  }
  return {groups,status};
}

// ---------------------------------------------------------------------------------------------
// Default filename prefix from the cover's series line: "TS #1352 - A Suite of English Carols".

const SERIES_ABBR = new Map([
  ["triumph series","TS"], ["festival series","FS"], ["general series","GS"], ["unity series","US"],
  ["american band journal","ABJ"], ["american festival series","AFS"], ["maple leaf brass","MLB"],
  ["hallelujah choruses","HC"], ["judd street collection","JSC"],
]);
// "Triumph Series 1352 (2023)", the year optional. Anchored to a whole text item on purpose: the
// series line is its own item on every cover seen so far, and matching across a joined run of items
// would let a composer line and a number from elsewhere on the page read as a series. The name is
// capitalised words only, which is what keeps prose like "SASB 126 TB 857" out; a one-word name with
// no year is rejected too, because that shape is a page or hymn reference rather than a series.
const SERIES_LINE = /^([A-Z][A-Za-z'&.-]*(?:\s+[A-Z][A-Za-z'&.-]*){0,4})\s+(\d{1,5})(?:\s*\((\d{4})\))?$/;
const COMPOSER_HINT = /\b(arr\.|arranged|trad\.|traditional|words|music by|lyrics)\b/i;
const LICENCE_HINT  = /\b(licen[cs]ed|copyright)\b/i;

function parseSeries(items){
  for(const it of items){
    const m = SERIES_LINE.exec(it.str.replace(/\s+/g," ").trim());
    if(!m) continue;
    if(m[1].split(" ").length < 2 && !m[3]) continue;
    return { series:m[1], number:m[2], year:m[3] || null, item:it };
  }
  return null;
}
// Known series get their published abbreviation; anything else takes the initials of its capitalised
// words, so "Winter Wonderland Series" becomes WWS rather than failing.
function abbreviate(name){
  return SERIES_ABBR.get(name.toLowerCase())
      || name.split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).join("").toUpperCase();
}
// The largest thing on the cover that is not the series line, a composer credit or the licence
// stamp. Ties break upwards, since a title sits above whatever shares its size.
function coverTitle(items, seriesItem){
  const cand = items.filter(i => i !== seriesItem && /[A-Za-z]{2,}/.test(i.str)
    && !COMPOSER_HINT.test(i.str) && !LICENCE_HINT.test(i.str));
  if(!cand.length) return null;
  return cand.reduce((a,b) => (b.size > a.size || (b.size === a.size && b.y > a.y)) ? b : a).str;
}
// Front matter is page 1, plus anything the cover rule filed under Full Score in the first COVER_MAX
// pages — which is where a prose notes page carrying the series line would sit.
function coverPages(pages, status){
  return pages.filter(p => p.cover && (p.n === 1 ||
    (p.n <= COVER_MAX && status[p.n] && status[p.n].part === "Full Score")));
}
// A plain hyphen-minus with spaces. Export uses the same separator between prefix and part, so one
// filename cannot mix "TS #1352 - Title" with an en dash immediately after it.
const SEP = " - ";

// A second way to read the front matter, for a set that prints no series line at all. A Maple Leaf
// Brass set puts "MLB 115" on its letterhead and "No. 115" over the first score page, and the two
// never meet on one line: SERIES_LINE reads "MLB 115" and then throws it away, because one
// capitalised word with no year is a page or hymn reference far more often than it is a series.
//
// The words "Maple Leaf Brass" do appear in that set — in the running head of every one of its
// twenty-eight part pages, which is exactly where this must not read from. A running head is not a
// statement about the document, it is a statement about the page, and a set whose parts are drawn
// from two journals would name whichever journal the last part came from. So the search stays on the
// front matter, the same pages the primary path reads: page 1, plus anything the cover rule filed
// under Full Score inside the first COVER_MAX pages.
const SERIES_NUMBER = /^No\.?\s*(\d{1,5})$/i;
// The cover shorthand: a known series abbreviation and its number, as its own item. Only the
// abbreviations the map already knows are admitted, which is what keeps "SASB 126" and "TB 857" —
// hymn book references, printed in exactly this shape — from naming a series.
const ABBR_LINE = new RegExp(`^(${[...SERIES_ABBR.values()].join("|")})\\s+(\\d{1,5})$`);
// Some embedded fonts drop the "ti" pair when the text is extracted: "The Salvation Army Maple Leaf
// Brass" arrives as "The Salva" · "on Army Maple Leaf Brass". Nothing that reads a header may assume
// clean words, so a series name is matched with every "ti" in it optional, and against the page's
// items joined rather than one at a time — the dropout can fall inside the name as easily as beside
// it ("Judd Street Collection" would arrive as "Judd Street Collec on"), and it splits the run into
// two items when it does.
function seriesPattern(name){
  const src = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+").replace(/ti/g, "(?:ti|\\s*)");
  return new RegExp(`(?<![a-z])${src}(?![a-z])`, "i");
}
function findSeriesCue(covers){
  for(const p of covers){
    const text = p.cover.map(i => i.str).join(" ").replace(/\s+/g, " ");
    for(const [name, abbr] of SERIES_ABBR) if(seriesPattern(name).test(text)) return { name, abbr };
    for(const it of p.cover){
      const m = ABBR_LINE.exec(it.str.replace(/\s+/g, " ").trim());
      if(m) return { name:m[1], abbr:m[1] };
    }
  }
  return null;
}
// The number, and with it the page the title is read from: a set that prints its number over the
// first page of the score prints the full title there too, spelled the way the parts spell it
// ("Prelude - The Reason I Live"), where the cover breaks it across two lines at two sizes.
function findSeriesNumber(covers){
  for(const p of covers) for(const it of p.cover){
    const m = SERIES_NUMBER.exec(it.str.replace(/\s+/g, " ").trim());
    if(m) return { page:p, number:m[1], item:it };
  }
  return null;
}

function seriesName(pages, status){
  const covers = coverPages(pages, status);
  for(const p of covers){
    const hit = parseSeries(p.cover);
    if(!hit) continue;
    const title = coverTitle(p.cover, hit.item);
    if(!title) continue;
    const abbr = abbreviate(hit.series);
    return { page:p.n, series:hit.series, abbr, number:hit.number, year:hit.year, title,
             prefix:`${abbr} #${hit.number}${SEP}${title}` };
  }
  // Only when the single-line pattern found nothing anywhere in the front matter. Both halves are
  // required: a number with no series names nothing, and a series with no number is not a set.
  const cue = findSeriesCue(covers), num = findSeriesNumber(covers);
  if(cue && num){
    const title = coverTitle(num.page.cover, num.item);
    if(title) return { page:num.page.n, series:cue.name, abbr:cue.abbr, number:num.number, year:null,
                       title, prefix:`${cue.abbr} #${num.number}${SEP}${title}` };
  }
  return null;
}
// The prefix the box is pre-filled with. The series line if the cover has one, otherwise exactly
// what it was before: the piece numbers joined, else the source filename.
function defaultPrefix(pages, status, numbers, fileName){
  const s = seriesName(pages, status);
  if(s) return s.prefix;
  const nums = [...numbers].sort((a,b)=>a-b);
  return nums.length ? nums.join("-") : fileName.replace(/\.pdf$/i,"");
}

// ---------------------------------------------------------------------------------------------
// Can this document be copied at all?
//
// Sets arrive having been through a web PDF tool, and some come back with permissions encryption
// bolted on — mlb.pdf carries /Filter/Standard /R 6 /CFM/AESV3, AES-256 with an empty user password
// and /P -1052. pdf.js decrypts that without being asked, which is why every page of such a set reads,
// detects and thumbnails perfectly; pdf-lib does not decrypt at all. Loading with
// `{ ignoreEncryption: true }` only stops it refusing at the door — the strings and streams behind
// that door are still ciphertext, so the page tree resolves to nothing and the first copyPages throws.
//
// There is no flag that tells the two cases apart before the fact, so this asks the question by doing
// the smallest possible version of the work: copy one page into a new document and save it. If those
// bytes come back, the export can be built; if anything throws, nothing is built and the user is told
// why. Handed a `create` function rather than reaching for PDFLib, so the core block stays free of
// browser globals and the harness can drive it.
async function canCopyPages(src, create){
  try{
    const probe = await create();
    const [first] = await probe.copyPages(src, [0]);
    probe.addPage(first);
    await probe.save();
    return true;
  }catch(e){
    // The caller reports; the reason is only ever useful in the console.
    if(typeof console !== "undefined") console.warn("Export probe failed:", e);
    return false;
  }
}
const ENCRYPTED_MSG = "This PDF is password-protected and can't be split";
</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let state = null;

const $ = id => document.getElementById(id);
const drop = $("drop"), fileIn = $("file");
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0]; if(f) load(f);});
fileIn.addEventListener("change",()=>{ if(fileIn.files[0]) load(fileIn.files[0]); });
$("reset").addEventListener("click",()=>location.reload());
$("prefix").addEventListener("input",updateExample);
$("dedupe").addEventListener("change",render);
$("export").addEventListener("click",exportParts);

function currentPlan(){ return plan(state.pages, $("dedupe").checked); }

async function load(file){
  setOut("Reading pages…");
  showProgress(0,0,"Reading pages…");
  const bytes = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  const pages = [];
  const numbers = new Set(); const titles = new Set();

  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale:1});
    const tc = await page.getTextContent();
    scanMeta(uprightItems(tc.items), numbers, titles);
    const rec = pageRecord(i, tc.items, vp.height, vp.width);

    // small thumbnail for the review table
    const tvp = page.getViewport({scale: 110/vp.width});
    const c = document.createElement("canvas"); c.width=tvp.width; c.height=tvp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:tvp}).promise;
    rec.thumb = c.toDataURL("image/jpeg",0.6);

    pages.push(rec);
    setOut(`Reading pages… ${i}/${pdf.numPages}`);
    showProgress(i, pdf.numPages, `Reading pages… ${i}/${pdf.numPages}`);
  }

  const nums = [...numbers].sort((a,b)=>a-b);
  const titleList = [...titles];
  state = { bytes, pages, nums, titleList, fileName:file.name };
  const { status } = currentPlan();

  $("title").textContent = titleList.length ? titleList.join(" · ") : file.name;
  $("meta").innerHTML = `<b>${pages.length}</b> pages · piece ${nums.length>1?"numbers":"number"} <b>${nums.join(", ")||"not found"}</b>`;
  $("prefix").value = defaultPrefix(pages, status, numbers, file.name);
  $("summary").classList.remove("hidden"); $("review").classList.remove("hidden");
  drop.classList.add("hidden");
  hideProgress();
  setOut("");
  render(); updateExample();
}

function render(){
  const {groups,status} = currentPlan();
  const options = partOptions(state.pages);
  const tb = $("rows"); tb.innerHTML="";
  for(const p of state.pages){
    const s = status[p.n];
    const tr = document.createElement("tr"); if(s.dropped) tr.className="dropped";
    const sel = document.createElement("select");
    // Only a page that resolves to nothing is flagged red; an inherited page is a normal outcome.
    sel.className = s.part?"":"warn";
    sel.add(new Option(INHERIT_LABEL,INHERIT));
    options.forEach(name=>sel.add(new Option(name,name)));
    sel.add(new Option(SKIP_LABEL,SKIP));
    // Show the effective part, so an inherited page names the part it continues.
    sel.value = p.override===SKIP ? SKIP : (s.part||INHERIT);
    sel.addEventListener("change",()=>{ p.override = sel.value===INHERIT ? undefined : sel.value; render(); });
    tr.innerHTML = `<td class="n">${p.n}</td><td class="th"><img src="${p.thumb}" alt=""></td><td></td><td class="status ${s.dup?"dup":""}">${s.label}</td>`;
    tr.children[2].appendChild(sel);
    tb.appendChild(tr);
  }
  const missing = state.pages.filter(p=>!status[p.n].part && p.override!==SKIP).length;
  $("export").textContent = `Export ${groups.size} part${groups.size===1?"":"s"}`;
  $("export").disabled = groups.size===0;
  if(missing) setOut(`${missing} page${missing===1?"":"s"} not detected — set the part or it will be skipped.`,"err"); else setOut("");
}

function updateExample(){
  $("example").textContent = `e.g. ${safeName($("prefix").value)}${SEP}1st Cornet Bb.pdf`;
}

function setOut(msg,cls){ const o=$("out"); o.textContent=msg; o.className="out "+(cls||""); }

// Load progress lives at the top of the page as well as in the status line: on a 79-page score
// the review card is far below the fold while the read runs, so #out alone tells nobody anything.
function showProgress(done,total,msg){
  $("progress").classList.remove("hidden");
  $("pbar").style.width = total ? `${Math.round(done/total*100)}%` : "0%";
  $("ptext").textContent = msg;
}
function hideProgress(){ $("progress").classList.add("hidden"); $("pbar").style.width="0%"; }

async function exportParts(){
  const {groups} = currentPlan();
  const prefix = safeName($("prefix").value)||"parts";
  $("export").disabled = true; setOut("Building files…");
  try{
    // ignoreEncryption gets a permissions-encrypted set past the door; canCopyPages decides whether
    // anything behind it can actually be read. Both have to hold before a single part is built, so a
    // set that cannot be split says so instead of half-filling a ZIP.
    let src = null;
    try{ src = await PDFLib.PDFDocument.load(state.bytes, {ignoreEncryption:true}); }
    catch(e){ console.warn("PDF load failed:", e); }
    if(!src || !await canCopyPages(src, () => PDFLib.PDFDocument.create())){
      setOut(ENCRYPTED_MSG, "err");
      return;
    }
    const zip = new JSZip(); const list = $("files"); list.innerHTML="";
    const names = [...groups.keys()].sort((a,b)=>partOrder(a)-partOrder(b));
    for(const part of names){
      const pageNums = groups.get(part);
      const doc = await PDFLib.PDFDocument.create();
      const copied = await doc.copyPages(src, pageNums.map(n=>n-1));
      copied.forEach(pg=>doc.addPage(pg));
      doc.setTitle(`${prefix}${SEP}${part}`);
      const fname = `${prefix}${SEP}${part}.pdf`;
      zip.file(fname, await doc.save());
      const li=document.createElement("li"); li.innerHTML=`<b>${fname}</b> · ${pageNums.length} page${pageNums.length===1?"":"s"}`; list.appendChild(li);
    }
    const blob = await zip.generateAsync({type:"blob"});
    const zipName = `${prefix}.zip`;
    const done = `Exported ${names.length} part${names.length===1?"":"s"}.`;
    const download = () => {
      const url = URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=zipName;
      document.body.appendChild(a); a.click(); a.remove();
      // Hold the blob long enough for the click to start the download, then release it.
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      setOut(done,"ok");
    };
    const f = new File([blob], zipName, {type:"application/zip"});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f], title:zipName}); setOut(done,"ok"); }
      catch(e){
        // Dismissing the share sheet is a choice, not a failure. Anything else — the sheet refusing
        // the file, a permissions error, an iPadOS quirk — must still hand over the ZIP rather than
        // report "Export failed" to someone whose parts were built successfully.
        if(e.name === "AbortError"){ setOut("Export cancelled."); }
        else { console.warn("Share failed, falling back to download:", e); download(); }
      }
    }else{
      download();
    }
  }catch(e){
    console.error(e); setOut(`Export failed: ${e.message}`,"err");
  }finally{ $("export").disabled=false; }
}
</script>
</body>
</html>
